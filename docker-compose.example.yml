version: '3.8'

services:
  slzb-exporter:
    image: ghcr.io/d0ugal/slzb-exporter:v2.16.61@sha256:7e37f75f48b848fb9c2946bf70fc864efc8590a853e95abb64b92dfd1a984f9f
    container_name: slzb-exporter
    ports:
      - "9110:9110"
    environment:
      - TZ=Europe/London
      # Server configuration
      - SLZB_EXPORTER_SERVER_HOST=0.0.0.0
      - SLZB_EXPORTER_SERVER_PORT=9110
      # Logging configuration
      - SLZB_EXPORTER_LOG_LEVEL=info
      - SLZB_EXPORTER_LOG_FORMAT=json
      # SLZB-06 device configuration
      - SLZB_EXPORTER_SLZB_API_URL=http://your-slzb-device.local
      - SLZB_EXPORTER_METRICS_DEFAULT_INTERVAL=10s
      # Optional HTTP Basic auth for a password protected device web UI
      # (both must be set)
      # - SLZB_EXPORTER_SLZB_USERNAME=admin
      # - SLZB_EXPORTER_SLZB_PASSWORD=change-me
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
